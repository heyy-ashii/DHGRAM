<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/dhgram-logo.png" />
    <link rel="apple-touch-icon" href="/dhgram-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <title>DHGRAM</title>
    <meta name="description" content="DHGRAM is a simple space for students to share thoughts and message each other, one-to-one." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DHGRAM" />
    <meta property="og:title" content="DHGRAM – Share & Message" />
    <meta property="og:description" content="Share thoughts and chat with other students on DHGRAM." />
    <meta property="og:image" content="/dhgram-logo.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Malayalam:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        const t = localStorage.getItem('dhgram-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch {}
    </script>
  </head>
  <body>
    <noscript>DHGRAM needs JavaScript enabled to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
